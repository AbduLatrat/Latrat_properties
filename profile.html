<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Profile - Latrat Properties</title>
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="style.css">
    <style>
        .center-panel { max-width:420px; margin: 60px auto; }
        .headline { text-align:center; margin-bottom:18px; }
    </style>
</head>
<body>
    <main class="center-panel">
        <div class="headline">
            <h1>Sign In or Create Account</h1>
            <p>Access saved properties, manage your profile, and contact agents quickly.</p>
        </div>

        <div class="profile-card">
            <div class="profile-tabs">
                <button class="button secondary" id="showRegister" type="button">Create Account</button>
                <button class="button secondary" id="showLogin" type="button">Login</button>
            </div>
            <div id="registerPanel" class="profile-panel">
                <form id="registerForm" class="profile-form">
                    <label for="fullName">Full Name</label>
                    <input id="fullName" type="text" placeholder="John Doe" required />
                    <label for="emailAddress">Email Address</label>
                    <input id="emailAddress" type="email" placeholder="you@example.com" required />
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Create a password" required />
                    <button class="button" type="submit">Create Account</button>
                </form>
            </div>
            <div id="loginPanel" class="profile-panel hidden">
                <form id="loginForm" class="profile-form">
                    <label for="loginEmail">Email Address</label>
                    <input id="loginEmail" type="email" placeholder="you@example.com" required />
                    <label for="loginPassword">Password</label>
                    <input id="loginPassword" type="password" placeholder="Your password" required />
                    <button class="button" type="submit">Login</button>
                </form>
            </div>
        </div>
    </main>

    <script>
        // reuse localStorage user logic from index
        const STORAGE_USERS = 'latratUsers';
        const STORAGE_USER = 'latratCurrentUser';

        function getUsers(){ return JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}'); }
        function setCurrentUser(user){ localStorage.setItem(STORAGE_USER, JSON.stringify(user)); }
        function saveUsers(users){ localStorage.setItem(STORAGE_USERS, JSON.stringify(users)); }

        const showRegister = document.getElementById('showRegister');
        const showLogin = document.getElementById('showLogin');
        const registerPanel = document.getElementById('registerPanel');
        const loginPanel = document.getElementById('loginPanel');
        const registerForm = document.getElementById('registerForm');
        const loginForm = document.getElementById('loginForm');

        showRegister.addEventListener('click', ()=>{ registerPanel.classList.remove('hidden'); loginPanel.classList.add('hidden'); });
        showLogin.addEventListener('click', ()=>{ loginPanel.classList.remove('hidden'); registerPanel.classList.add('hidden'); });

        registerForm.addEventListener('submit', function(e){
            e.preventDefault();
            const name = document.getElementById('fullName').value.trim();
            const email = document.getElementById('emailAddress').value.trim().toLowerCase();
            const password = document.getElementById('password').value;
            const users = getUsers();
            if(!name||!email||!password){ alert('Complete all fields'); return; }
            if(users[email]){ alert('Account already exists.'); return; }
            users[email] = { name, email, password };
            saveUsers(users);
            setCurrentUser({ name, email });
            alert('Account created. Redirecting home...');
            window.location.href = 'index.html';
        });

        loginForm.addEventListener('submit', function(e){
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim().toLowerCase();
            const password = document.getElementById('loginPassword').value;
            const users = getUsers();
            const user = users[email];
            if(!user || user.password !== password){ alert('Login failed'); return; }
            setCurrentUser({ name: user.name, email: user.email });
            alert('Login successful. Redirecting home...');
            window.location.href = 'index.html';
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', function(){
            document.documentElement.classList.add('page-visible');
            document.querySelectorAll('a[href]').forEach(a => {
                const href = a.getAttribute('href');
                if (!href || href.startsWith('#') || href.startsWith('mailto:') || a.hasAttribute('download')) return;
                a.addEventListener('click', function(e) {
                    const link = this.getAttribute('href');
                    if (!link) return;
                    e.preventDefault();
                    document.documentElement.classList.remove('page-visible');
                    setTimeout(() => window.location.href = link, 320);
                });
            });
        });
    </script>
</body>
</html>
